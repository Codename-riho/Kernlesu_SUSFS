name: "Advanced Build (forked from topnotchfreaks)"
permissions: 
     contents: read

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/topnotchfreaks/kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: string
        default: "codelinaro"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "both"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuManager:
        description: "Root manager (varian ksu)"
        required: true
        type: choice
        default: "SukiSU-Ultra"
        options:
          - "SukiSU-Ultra"
          - "BakaSU"
          - "KernelSU-Next-pershoot"
          - "KernelSU-Next"
          - "KernelSU-Official"
          - "Rissu-KSU"
      ksuRef:
        description: "Tag/branch/commit manager (kosong = default manager)"
        required: false
        type: string
        default: ""
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "250Hz"
        options:
          - "default"
          - "100Hz"
          - "250Hz"
          - "300Hz"
          - "1000Hz"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O2"
        options:
          - "default"
          - "O2"
          - "O3"
          - "Os"
      buildToolchains:
        description: "build tools"
        required: true
        type: choice
        default: "android-tools"
        options:
          - "android-tools"
          - "custom-tools"
      LtoOptimizations:
        description: "Choose LTO"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
           echo "BUILD_TIME=$(TZ=Asia/Jakarta date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 build-essential bc curl flex cpio rsync git zip dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 clang lld llvm llvm-dev bison libncurses-dev
          
      - name: "🧹 Aggressive Cleanup"
        run: |
          # Remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Prune Docker to remove hidden images and build cache
          sudo docker image prune --all --force
          sudo docker builder prune -a -f
          
      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        if: github.event.inputs.buildToolchains == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Konfigurasi global git untuk transfer file besar
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          mkdir -p .repo/local_manifests
          printf '<manifest>\n  <remove-project name="kernel/common" optional="true" />\n</manifest>\n' > .repo/local_manifests/skip-common.xml
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j"$(nproc --all)"
          rm -rf .repo
          
          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-r596125
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants"
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' "${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki" || true
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true
     
      - name: "💫 Get Toolchains"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        run: |
          set -e  # Exit on errors
      
          # Function to fetch latest release tar.gz URL from GitHub
          get_latest_github_release() {
            local repo_url="$1"
            latest_url=$(curl -sL "https://api.github.com/repos/$repo_url/releases/latest" | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
            
            if [[ -z "$latest_url" ]]; then
              echo "❌ Failed to fetch latest release from $repo_url!"
              exit 1
            fi
      
            printf "%s" "$latest_url"  # Use printf to output only the URL
          }
      
          clang_url=$(get_latest_github_release "greenforce-project/greenforce_clang")
      
          echo "✅ Clang URL: $clang_url"
      
          # Create clang directory
          mkdir -p clang
      
          # Check if it's an archive or a Git repo
          if [[ "$clang_url" == *.tar.gz ]]; then
            echo "🚀 Downloading latest Clang from: $clang_url..."
            wget --progress=bar:force -O "clang/clang.tar.gz" "$clang_url" || { echo "❌ Failed to download Clang!"; exit 1; }
      
            # Extract Clang
            echo "📦 Extracting Clang..."
            tar -xf clang/clang.tar.gz -C clang || { echo "❌ Extraction failed!"; exit 1; }
            rm -f clang/clang.tar.gz
          else
            echo "🚀 Cloning Clang from $clang_url..."
            git clone --recursive --depth=1 "$clang_url" clang || { echo "❌ Cloning failed!"; exit 1; }
          fi
      
          # Find Clang's bin directory
          if [ -d "clang/bin" ]; then
            CLANG_PATH="${{ github.workspace }}/clang/bin"
          else
            CLANG_PATH=$(find clang -type d -name "bin" | head -n 1)
            CLANG_PATH="${{ github.workspace }}/${CLANG_PATH}"
          fi
      
          # Ensure Clang binary exists
          if [ ! -f "$CLANG_PATH/clang" ]; then
            echo "❌ Clang binary not found in $CLANG_PATH! Build might fail."
            ls -R clang  # Debugging: Show extracted files
            exit 1
          fi
      
          echo "✅ Using Clang from $CLANG_PATH"
          echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
          echo "$CLANG_PATH" >> $GITHUB_PATH  # Ensures path is updated
      
          export PATH="$CLANG_PATH:$PATH"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CC=clang
          export AR="llvm-ar"
          export AS="llvm-as"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
      
          echo "⚙️ Using Clang version:"
          clang --version || echo "❌ Clang not found in PATH!"

      - name: 📐 Setup SWAP 20GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 20
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p
            
      - name: "😎 Set args for GKI kernels"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        id: generate-args
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
            args="-j$(nproc --all)"
            if [ -n "${{ env.OUT_DIR }}" ]; then
              mkdir -p $(pwd)/${{ env.OUT_DIR }}
              args="$args O=$(pwd)/${{ env.OUT_DIR }}"
            fi
            args="$args ARCH=arm64 LLVM=1 LTO=thin"
            args="$args CROSS_COMPILE=aarch64-linux-gnu-"
            args="$args CLANG_TRIPLE=aarch64-linux-gnu-"
            args="$args AR=llvm-ar"
            args="$args CC=clang"
            echo "args=$args" >> $GITHUB_OUTPUT

      - name: "⚙️ Configure kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          LOCAL_VERSION: ${{ inputs.localVersion }}
          LTO_MODE: ${{ inputs.LtoOptimizations }}
          OPT_LEVEL: ${{ inputs.optimizationLevel }}
          TICK_RATE: ${{ inputs.tickRate }}
        run: |
          set -euo pipefail
          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG_NAME"
          cfg() { scripts/config --file "$CONFIG_FILE" "$@"; }

          if [ -n "$LOCAL_VERSION" ]; then
            cfg --set-str LOCALVERSION "$LOCAL_VERSION"
          fi

          # LTO
          if [ "$LTO_MODE" = thin ]; then
            cfg -e LTO_CLANG -d LTO_CLANG_FULL -e LTO_CLANG_THIN -e THINLTO
          else
            cfg -e LTO_CLANG -e LTO_CLANG_FULL -d LTO_CLANG_THIN -d THINLTO
          fi

          # Full Metamodule Support
          cfg -e KALLSYMS -e TMPFS_XATTR -e TMPFS_POSIX_ACL -e OVERLAY_FS

          # Optimization level (default = hapus override, pakai default Kconfig)
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_/d' "$CONFIG_FILE"
          case "$OPT_LEVEL" in
            O2) cfg -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -d CC_OPTIMIZE_FOR_SIZE ;;
            O3) cfg -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3 -d CC_OPTIMIZE_FOR_SIZE ;;
            Os) cfg -d CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -e CC_OPTIMIZE_FOR_SIZE ;;
          esac

          # Tick rate (terima "250Hz" maupun "250"; selain itu = default)
          case "${TICK_RATE%Hz}" in
            100|250|300|1000)
              HZ="${TICK_RATE%Hz}"
              cfg -d HZ_100 -d HZ_250 -d HZ_300 -d HZ_1000 -e "HZ_$HZ" --set-val HZ "$HZ" -e NO_HZ_IDLE ;;
            *) echo "Tick rate: default" ;;
          esac

          # Sign builds
          # localversion: 0001-scripts-do-not-ship-full-auto_localversion.patch (nonaktif)
          if curl -fsSL -o /tmp/sign.patch "https://raw.githubusercontent.com/Dyatz/Topaz_resukisu_SUSFS/refs/heads/main/patches/0001-scripts-sign-builds.patch" \
             && patch -p1 --batch < /tmp/sign.patch; then
            echo "sign-builds patch applied"
          else
            echo "::warning::sign-builds patch gagal, lanjut tanpa patch"
          fi
          
      - name: "🔧 Add BBG Support (KSU variant only)"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
      - name: "🔧 Add NoMount Support"
        if: matrix.variant == 'ksu'
        working-directory: ${{ env.WORK_DIR }}/${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -
          
      - name: "⚔️ Setup root manager (${{ inputs.ksuManager }})"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          KSU_MANAGER: ${{ inputs.ksuManager || 'SukiSU-Ultra' }}
          KSU_REF: ${{ inputs.ksuRef }}
          SUSFS_BRANCH: gki-android13-5.15
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          MULTI_MANAGER_PATCH="https://raw.githubusercontent.com/RapliVx/kernel_builder/refs/heads/main/patch/ksun-add-more-managers-support.patch"
          EXTRA_PATCH_URL=""

          # Per manager: repo, branch hosting setup.sh, default ref,
          # whether the SUSFS->KSU patch is needed (0 = built-in support),
          # and an optional extra patch URL applied after setup.
          case "$KSU_MANAGER" in
            SukiSU-Ultra)           REPO="SukiSU-Ultra/SukiSU-Ultra";   SETUP_BRANCH=main;      DEFAULT_REF=builtin;   NEED_SUSFS_PATCH=0 ;;
            BakaSU)                 REPO="Baka-SU/BakaSU";              SETUP_BRANCH=main;      DEFAULT_REF=main;      NEED_SUSFS_PATCH=0 ;;
            KernelSU-Next-pershoot) REPO="pershoot/KernelSU-Next";      SETUP_BRANCH=dev-susfs; DEFAULT_REF=dev-susfs; NEED_SUSFS_PATCH=0; EXTRA_PATCH_URL="$MULTI_MANAGER_PATCH" ;;
            KernelSU-Next)          REPO="KernelSU-Next/KernelSU-Next"; SETUP_BRANCH=next;      DEFAULT_REF="";        NEED_SUSFS_PATCH=1 ;;
            KernelSU-Official)      REPO="tiann/KernelSU";              SETUP_BRANCH=main;      DEFAULT_REF="";        NEED_SUSFS_PATCH=1 ;;
            Rissu-KSU)              REPO="rsuntk/KernelSU";             SETUP_BRANCH=main;      DEFAULT_REF="";        NEED_SUSFS_PATCH=1 ;;
            *) die "Unknown manager: $KSU_MANAGER" ;;
          esac

          REF="${KSU_REF:-$DEFAULT_REF}"
          SETUP_URL="https://raw.githubusercontent.com/${REPO}/${SETUP_BRANCH}/kernel/setup.sh"
          echo "Manager: $KSU_MANAGER | ref: ${REF:-latest release tag}"
          echo "Setup script: $SETUP_URL"

          # Remove any previous install, then run the manager's setup script
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          curl -fsSL -o /tmp/ksu_setup.sh "$SETUP_URL" \
            || die "Failed to download $SETUP_URL"
          bash -x /tmp/ksu_setup.sh ${REF:+"$REF"} \
            || die "setup.sh for $KSU_MANAGER failed (ref: ${REF:-latest tag})"

          # The install dir name differs per manager (KernelSU, KernelSU-Next, ...),
          # so resolve it from the drivers/kernelsu symlink instead of hardcoding it.
          if [ ! -d drivers/kernelsu ]; then
            ls -ld KernelSU* drivers/kernelsu 2>&1 || true
            die "drivers/kernelsu symlink is missing or broken"
          fi
          KSU_DIR=$(dirname "$(readlink -f drivers/kernelsu)")
          echo "Install dir: $KSU_DIR"

          # Managers without built-in SUSFS need the integration patch
          if [ "$NEED_SUSFS_PATCH" = 1 ]; then
            echo "Applying SUSFS->KSU patch (branch: $SUSFS_BRANCH)"
            rm -rf /tmp/susfs4ksu
            git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
            PATCH_FILE=/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
            [ -f "$PATCH_FILE" ] || die "SUSFS patch not found: $PATCH_FILE"
            patch -d "$KSU_DIR" -p1 --batch < "$PATCH_FILE" \
              || die "SUSFS patch incompatible with $KSU_MANAGER (ref: ${REF:-latest tag}). Try an older tag."
          else
            echo "SUSFS->KSU patch not needed for $KSU_MANAGER (built-in)"
          fi

          # Optional extra patch (e.g. multi-manager support)
          if [ -n "$EXTRA_PATCH_URL" ]; then
            echo "Applying extra patch: $EXTRA_PATCH_URL"
            curl -fsSL -o /tmp/ksu_extra.patch "$EXTRA_PATCH_URL" \
              || die "Failed to download $EXTRA_PATCH_URL"
            patch -d "$KSU_DIR" -p1 --batch < /tmp/ksu_extra.patch \
              || die "Extra patch failed on $KSU_MANAGER (ref: ${REF:-latest tag})"
          fi

          scripts/config --file "arch/arm64/configs/$DEFCONFIG_NAME" -e CONFIG_KSU

          VER=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo Unknown)
          echo "$KSU_MANAGER setup done ($VER)"
          echo "- Root manager: **$KSU_MANAGER** ($VER)" >> "$GITHUB_STEP_SUMMARY"
          
      - name: "🧬 Apply SUSFS kernel patch"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          SUSFS_BRANCH: gki-android13-5.15
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          SUSFS_DIR=/tmp/susfs4ksu
          KP="$SUSFS_DIR/kernel_patches"
          [ -d "$SUSFS_DIR" ] || git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_DIR"

          # Fake patch: sembunyikan include vendor-hook sementara supaya konteks patch SUSFS cocok
          hide_inc() { # file header
            grep -qxF "#include <trace/hooks/$2>" "$1" && sed -i "\|^#include <trace/hooks/$2>\$|d" "$1"
          }
          restore_inc() { # file header anchor
            grep -q "trace/hooks/$2" "$1" && return 0
            if grep -qxF "$3" "$1"; then
              sed -i "\|^$3\$|a #include <trace/hooks/$2>" "$1"
            else
              echo "::warning::anchor '$3' tidak ada di $1, kembalikan include trace/hooks/$2 secara manual"
            fi
          }
          NS_FAKE=0; MM_FAKE=0
          hide_inc fs/namespace.c blk.h    && NS_FAKE=1 || echo "blk.h tidak ada di fs/namespace.c, fake patch dilewati"
          hide_inc fs/proc/task_mmu.c mm.h && MM_FAKE=1 || echo "mm.h tidak ada di fs/proc/task_mmu.c, fake patch dilewati"

          # Patch kernel SUSFS: lanjut walau ada hunk gagal, tapi tampilkan hasilnya
          if patch -p1 --batch < "$KP/50_add_susfs_in_gki-android13-5.15.patch"; then
            echo "SUSFS kernel patch applied"
          else
            echo "::warning::SUSFS kernel patch sebagian gagal, file .rej:"
            find . -name '*.rej' -not -path './out/*' | head -20
          fi

          # Salin sumber SUSFS (selalu timpa)
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$KP/$f" ]; then
              install -D -m 0644 "$KP/$f" "$f" && echo "copied $f"
            else
              echo "::warning::$f tidak ada di repo SUSFS"
            fi
          done
          [ -f fs/susfs.c ] && [ -f include/linux/susfs.h ] || die "fs/susfs.c atau include/linux/susfs.h tidak ada"

          # Config SUSFS
          opts=()
          for o in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            opts+=(-e "CONFIG_$o")
          done
          scripts/config --file "arch/arm64/configs/$DEFCONFIG_NAME" "${opts[@]}"

          # Kembalikan include yang tadi disembunyikan
          if [ "$NS_FAKE" = 1 ]; then restore_inc fs/namespace.c blk.h '#include "internal.h"'; fi
          if [ "$MM_FAKE" = 1 ]; then restore_inc fs/proc/task_mmu.c mm.h '#include <linux/pkeys.h>'; fi

          echo "SUSFS kernel-side integration done"
          
      - name: "❄️ Build kernel"
        if: github.event.inputs.buildToolchains == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        env:
          LTO: ${{ inputs.LtoOptimizations }}
          BUILD_CONFIG: ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.LtoOptimizations }}" = "thin" ]; then
           LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all) 2>&1 | tee build_full.log
          else
           LTO=full BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all) 2>&1 | tee build_full.log
          fi
          
      - name: "👍 Make defconfig"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: Patch samsung_kdp to include ucounts 
        run: | 
          set -euo pipefail file="drivers/kernelsu/compat/samsung_kdp.c" if [ -f "$file" ]; then if grep -q '#include <linux/ucounts.h>' "$file"; then echo "Already patched" else # Insert the include right after the first linux include block awk 'BEGIN{p=0} /^#include <linux// && p==0 {print; print "#include <linux/ucounts.h>"; p=1; next} {print}' "$file" > "$file.tmp" && mv "$file.tmp" "$file" echo "Patched $file" # show top lines for debug sed -n '1,60p' "$file" |
          | true fi else echo "File not found: $file — skipping patch" >&2 fi

      - name: "🎶 Build kernel"
        if: github.event.inputs.buildToolchains == 'custom-tools'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          set -o pipefail
          make ${args} \
            LLVM=1 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            -j$(nproc --all) 2>&1 | tee ${{ env.WORK_DIR }}/build_full.log

      - name: "🚨 Kumpulkan Log Error (Jika Gagal)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ matrix.variant }}
          path: |
            ${{ env.WORK_DIR }}/build_full.log
            ${{ env.WORK_DIR }}/out/${{ env.kernelDir }}/${{ env.kernelName }}/.config
            ${{ env.WORK_DIR }}/${{ env.kernelDir }}/${{ env.kernelName }}/out/.config
            ${{ env.WORK_DIR }}/${{ env.kernelDir }}/${{ env.kernelName }}/*.rej
          retention-days: 3
          if-no-files-found: ignore
          
      - name: 📦 Prepare artifact
        working-directory: ${{ env.WORK_DIR }}
        run: |
         mkdir -p out/dist

         if [ "${{ github.event.inputs.buildToolchains }}" = "android-tools" ]; then
          src="out/dist/Image"
         else
          src="${{ env.kernelDir }}/${{ env.kernelName }}/out/arch/arm64/boot/Image"
         fi

         cp "${src}" "out/dist/Image.${{ matrix.variant }}"
         
      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ env.WORK_DIR }}/out/dist/Image.${{ matrix.variant }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b master AnyKernel3
          
          # Copy kernels
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          # Create ZIP
          ZIP_NAME="CryoKernel_$(TZ=Asia/Jakarta date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Package created: $ZIP_NAME"

      - name: "📤 Upload kernel ZIP artifact"
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false
          retention-days: 30
          if-no-files-found: error

     
