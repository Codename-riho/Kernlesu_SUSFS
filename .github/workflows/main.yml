      - name: "📱 Send to Telegram"
        env:
           TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
           TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
           KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
           KSU_REF: ${{ inputs.ksu_ref }}
           DEVICE_NAME: "Redmi Note 12 4G"
           RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
           if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
             echo "::notice::Secret Telegram belum diisi, notifikasi dilewati"; exit 0
           fi

           esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
           IMAGES=$(cd AnyKernel3 && ls Image.* 2>/dev/null | sed 's/^Image\.//' | paste -sd, - | sed 's/,/, /g')
           MANAGER=$(printf '%s' "$KSU_MANAGER${KSU_REF:+ @ $KSU_REF}" | esc)
           DATE="${ZIP_NAME#CryoKernel_}"; DATE="${DATE%.zip}"

           # try to read build_tools from downloaded artifacts
           BUILD_TOOLS="android-tools (clang-r547379)"
           BT=$(find ./artifacts -type f -name 'build_tools.txt' -print -quit || true)
           if [ -n "$BT" ]; then
             BUILD_TOOLS=$(head -n1 "$BT" | tr -d '\r\n' || true)
           else
             # fallback to inputs if file not present
             if [ "${{ github.event.inputs.toolchain_type }}" = "custom-tools" ]; then
               BUILD_TOOLS="custom-tools (unknown clang)"
             else
               BUILD_TOOLS="android-tools (clang-r547379)"
             fi
           fi

           MSG=$(cat <<EOT
           ✅ <b>Kernel Build Successful</b>

           <b>📦 Build Information:</b>
           • 🐧 Kernel: <code>Linux ${KERNEL_VERSION}</code>
           • Android: <code>13-16</code>
           • Branch: <code>android13-5.15-lts</code> (GKI), <code>kernel.lnx.5.15.r1-rel</code> (CLO)
           • Device: <code>${DEVICE_NAME}</code>

           <b>⚙️ Configuration:</b>
           • LTO: <code>full</code>
           • Optimization: <code>-O2</code>
           • Images: <code>${IMAGES}</code>
           • ⚔️ KSU Manager: <code>${MANAGER}</code>
           • SUSFS: <code>Enabled (GKI A13-5.15)</code>
           • Local Version: <code>Cryo-GKI-${DATE}</code>, <code>Cryo-CLO-${DATE}</code>
           • Build Tools: <code>${BUILD_TOOLS}</code>

           🕐  <b>Build Date:</b> $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')
           📦 <b>Package:</b> <code>${ZIP_NAME}</code>

           🔗 <a href="${RUN_URL}">Unduh dari Artifacts (halaman run)</a>
           EOT
           )
           
           # Perintah ini yang sebelumnya hilang untuk mengirim isi dari variabel MSG
             RESP=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
             --data-urlencode "parse_mode=HTML" \
             --data-urlencode 'link_preview_options={"is_disabled":true}' \
             --data-urlencode "text=${MSG}" || true)
           
           echo "$RESP" | jq -e '.ok' >/dev/null 2>&1 \
             && echo "✅ Telegram terkirim" \
             || echo "::warning::Telegram menolak pesan: $(echo "$RESP" | jq -r '.description // empty' 2>/dev/null)"
   
  notify-failure:
    name: "📱 Notify Telegram (failed)"
    runs-on: ubuntu-latest
    needs: [build-kernels, package-kernels]
    if: failure()
    permissions:
      actions: read
    steps:
      - name: "📱 Send to Telegram"
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          KSU_REF: ${{ inputs.ksu_ref }}
          DEVICE_NAME: "Redmi Note 12 4G"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Notifikasi tidak boleh menggagalkan workflow (runner memakai bash -e, jadi errexit dimatikan)
          set -uo pipefail
          set +e
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::notice::Secret Telegram belum diisi, notifikasi dilewati"; exit 0
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          send_msg() {
            local resp
            resp=$(curl -sS "$API/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "parse_mode=HTML" \
              --data-urlencode 'link_preview_options={"is_disabled":true}' --data-urlencode "text=$1") \
              || { echo "::warning::curl ke Telegram gagal"; return 1; }
            echo "$resp" | jq -e '.ok' >/dev/null 2>&1 \
              || { echo "::warning::Telegram menolak: $(echo "$resp" | jq -r '.description // .' 2>/dev/null)"; return 1; }
          }

          # Job dan step yang gagal (lewat GitHub API)
          FAILED=""
          while IFS=$'\t' read -r job step; do
            if [ -n "$job" ]; then
              FAILED+="• <b>$(printf '%s' "$job" | esc)</b> → <code>$(printf '%s' "$step" | esc)</code>"$'\n'
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
                     --jq '.jobs[] | select(.conclusion=="failure") | [.name, (([.steps[]? | select(.conclusion=="failure")][0].name) // "-")] | @tsv' 2>/dev/null)
          if [ -z "$FAILED" ]; then FAILED="• (detail tidak tersedia)"$'\n'; fi

          MANAGER="$KSU_MANAGER"
          if [ -n "$KSU_REF" ]; then MANAGER="$KSU_MANAGER @ $KSU_REF"; fi

          MSG=$(cat <<EOF
          ❌ <b>Kernel Build Failed</b>

          <b>📦 Build Information:</b>
          • Kernel: <code>Linux ${KERNEL_VERSION}</code>
          • Android: <code>13-16</code>
          • Branch: <code>android13-5.15-lts</code> (GKI), <code>kernel.lnx.5.15.r1-rel</code> (CLO)
          • Device: <code>$(printf '%s' "$DEVICE_NAME" | esc)</code>

          <b>⚙️ Configuration:</b>
          • LTO: <code>full</code>
          • Optimization: <code>-O2</code>
          • Build Type: <code>both</code>
          • KSU Manager: <code>$(printf '%s' "$MANAGER" | esc)</code>
          • SUSFS: <code>Enabled (GKI A13-5.15)</code>
          • Build tools="android-tools (clang-r547379)"
            if [ "${{ github.event.inputs.toolchain_type }}" = "custom-tools" ]; then
            Build tools="custom-tools (clang - see build logs)"
            fi

          💥 <b>Gagal di:</b>
          ${FAILED}
          🕐  <b>Build Date:</b> $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')        
          🔍 Cek <a href="${RUN_URL}">workflow logs</a> (artifact <code>error-logs-*</code> berisi build_full.log)
          EOF
          )
          
           # Perintah ini yang sebelumnya hilang untuk mengirim isi dari variabel MSG
           RESP=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
             --data-urlencode "parse_mode=HTML" \
             --data-urlencode 'link_preview_options={"is_disabled":true}' \
             --data-urlencode "text=${MSG}" || true)
           
           echo "$RESP" | jq -e '.ok' >/dev/null 2>&1 \
             && echo "✅ Telegram terkirim" \
             || echo "::warning::Telegram menolak pesan: $(echo "$RESP" | jq -r '.description // empty' 2>/dev/null)"

          send_msg "$MSG"
          exit 0
          
